# 一個 Cloudflare Worker 同時做三件事：託管網頁（public/）、回報 API（/api/*）、LINE Bot（/api/line）
name = "period-pal-map"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# 公開設定（不是密碼，可以寫在這裡）
[vars]
LIFF_ID = "2012205207-LsQ1jRQE"  # LINE Login 頻道的 LIFF ID：好朋友 Pal 在 LINE 裡打開、徽章同步用
AGENT_MODEL = "claude-opus-5-5"  # 每週摘要 Agent 用的 Claude 模型

# 每週摘要 Agent：每週一 01:00 UTC = 台北 09:00
[triggers]
crons = ["0 1 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "period-pal-map"
database_id = "c2af0eed-2d86-43f7-bf9e-15beb223d946"

# 機密設定用 `npx wrangler secret put <名稱>` 設定，不要寫在這個檔案：
#   ADMIN_KEY                  下載 CSV 用的密碼
#   LINE_CHANNEL_SECRET        LINE Developers → Messaging API 頻道的 Channel secret
#   LINE_CHANNEL_ACCESS_TOKEN  同一頁的 Channel access token（long-lived）
#   LINE_STAFF_TO              補貨群組的 ID（把 Bot 加進群組後傳「群組ID」取得）
#   ANTHROPIC_API_KEY          Claude API 金鑰（每週摘要 Agent 用，console.anthropic.com 取得）
#   LINE_OWNER_TO              （選填）接收每週摘要草稿的 LINE ID；沒設就送到補貨群組

# 預覽版（PR 的自動預覽，`wrangler preview`）用的資料庫。
# 目前和正式版共用同一個 D1：在預覽版送出的回報與徽章會出現在正式地圖上。
# 之後若要分開，在 Cloudflare 建一個新的 D1、執行 schema.sql，再把下面的 database_id 換成新的。
[[previews.d1_databases]]
binding = "DB"
database_name = "period-pal-map"
database_id = "c2af0eed-2d86-43f7-bf9e-15beb223d946"
