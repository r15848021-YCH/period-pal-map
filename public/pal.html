<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好朋友 Pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}
/* Layout: phone-first single column for the LINE in-app browser (LIFF); hash views 今天 / 經期 / 心情 / 地圖 / 遊戲 / 徽章
   under a sticky tab bar. 合併方案 A（補給地圖）與方案 B（經期・心情），再加上科普遊戲。 */
:root{
  --bg:#f6f4f7; --surface:#ffffff; --fg:#231c2b; --muted:#6c6375; --line:#e3dde8;
  --accent:#8a2f62; --accent-ink:#ffffff; --accent-soft:#f5e6ef;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --low:#a35d00; --low-soft:#fbeed8; --out:#b3261e; --out-soft:#fbe3e1;
  --unk:#5d6470; --unk-soft:#eceef1;
  --pre:#b7791f; --pre-soft:#fbf0dc;
  --m1:#4f5d8f; --m2:#8077ad; --m3:#a99aa8; --m4:#cf7fa5; --m5:#a8336f;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17131b; --surface:#221c28; --fg:#f1ebf4; --muted:#a79daf; --line:#372e3e;
  --accent:#e889bb; --accent-ink:#2a0e1d; --accent-soft:#3a2231;
  --ok:#6fd39c; --ok-soft:#173326; --low:#f2b25a; --low-soft:#3a2a12; --out:#ff8a80; --out-soft:#3d1a18;
  --unk:#b4bac4; --unk-soft:#2a2b31;
  --pre:#f0b964; --pre-soft:#3a2c15;
  --m1:#8d9bd0; --m2:#ada4dc; --m3:#c4b6c3; --m4:#ee9fc4; --m5:#ff7fb9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131b; --surface:#221c28; --fg:#f1ebf4; --muted:#a79daf; --line:#372e3e;
  --accent:#e889bb; --accent-ink:#2a0e1d; --accent-soft:#3a2231;
  --ok:#6fd39c; --ok-soft:#173326; --low:#f2b25a; --low-soft:#3a2a12; --out:#ff8a80; --out-soft:#3d1a18;
  --unk:#b4bac4; --unk-soft:#2a2b31;
  --pre:#f0b964; --pre-soft:#3a2c15;
  --m1:#8d9bd0; --m2:#ada4dc; --m3:#c4b6c3; --m4:#ee9fc4; --m5:#ff7fb9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.brand span{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{padding:8px 10px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:13px;color:var(--fg);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.demo button{font:inherit;font-size:13px;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
h2.sec{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:24px 0 8px;font-weight:700}
.card{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.link{color:var(--accent);font-weight:500}
.chipbtn{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.lbl{font-size:13px;font-weight:700;margin:14px 0 8px}
.lbl:first-child{margin-top:0}
/* today */
.hero{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.hero .day{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero .day b{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hero .day span{color:var(--muted)}
.hero .next{font-size:17px;font-weight:700}
.hero .next small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.cbar{position:relative;height:14px;border-radius:7px;background:var(--line);overflow:hidden;display:flex}
.cbar i{display:block;height:100%}
.cbar .p{background:var(--accent)} .cbar .r{background:transparent} .cbar .w{background:var(--pre)}
.cmark{position:relative;height:18px}
.cmark span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--fg);font-weight:700;white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mscale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mbtn{font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-width:0}
.mbtn i{width:18px;height:18px;border-radius:50%;background:var(--mc)}
.mbtn[aria-pressed="true"]{border-color:var(--mc)}
.flows{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fbtn{font:inherit;font-size:13px;padding:8px 2px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-width:0}
.fbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.saved{font-size:12px;color:var(--ok);min-height:1.6em;margin:8px 0 0}
.supply{display:flex;justify-content:space-between;gap:12px;align-items:center}
.supply b{font-size:22px;color:var(--ok);font-variant-numeric:tabular-nums}
.insights{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.insights li{padding-left:14px;position:relative}
.insights li::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.insights li.flag::before{background:var(--out)}
.insights li.flag{color:var(--fg)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--unk-soft);color:var(--unk);vertical-align:1px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:500;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea.out{width:100%;min-height:120px;font-family:var(--f-mono);font-size:11px;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.calhead b{font-size:17px}
.calhead button{font:inherit;font-size:18px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted)}
.cell{font:inherit;position:relative;aspect-ratio:1;max-width:100%;min-width:0;border-radius:10px;border:1px solid transparent;background:var(--surface);color:var(--fg);cursor:pointer;font-size:14px;font-variant-numeric:tabular-nums;padding:0}
.cell.out{visibility:hidden}
.cell.per{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cell.pred{border:2px dashed var(--accent)}
.cell.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cell .md{position:absolute;left:50%;bottom:5px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);background:var(--mc)}
.cell.per .md{box-shadow:0 0 0 1.5px var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{color:var(--muted);font-size:12px}
/* mood */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.phase{display:grid;grid-template-columns:5.5em 1fr 2.5em;gap:8px;align-items:center;font-size:13px}
.phase .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.phase .bar i{display:block;height:100%;border-radius:5px}
.phase b{font-variant-numeric:tabular-nums;text-align:right}
.notes{display:flex;flex-direction:column}
.notes div{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.notes div:first-child{border-top:0;padding-top:0}
.notes small{color:var(--muted);font-family:var(--f-mono);font-size:11.5px;margin-right:8px}
textarea.memo{font:inherit;width:100%;min-height:64px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
/* map (from 好朋友地圖) */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.group{margin-top:20px}
.group h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%}
.row .meta{min-width:0}
.row .name{font-weight:700}
.row .sub{color:var(--muted);font-size:12px}
.row .sub .t{font-family:var(--f-mono);font-size:11.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-full{--c:var(--ok);--cs:var(--ok-soft)} .s-low{--c:var(--low);--cs:var(--low-soft)}
.s-empty{--c:var(--out);--cs:var(--out-soft)} .s-unk{--c:var(--unk);--cs:var(--unk-soft)}
.pill{color:var(--c);background:var(--cs)} .dot{background:var(--c)}
.row a.go{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rep h2{font-size:24px;margin:20px 0 0;font-weight:900;text-wrap:balance}
.rep .where{color:var(--muted);margin:2px 0 0}
.rep .now{margin-top:12px;font-size:13px;color:var(--muted)}
.q{margin:24px 0 10px;font-weight:700}
.choices{display:grid;gap:10px}
.choice{font:inherit;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.choice b{font-size:18px}
.choice small{display:block;color:var(--muted);font-size:13px}
.choice .dot{width:16px;height:16px;flex:none}
.choice[aria-pressed="true"]{border-color:var(--c);background:var(--cs)}
.submit{font:inherit;font-weight:700;font-size:16px;width:100%;margin-top:24px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.submit:disabled{opacity:.4;cursor:not-allowed}
.thanks{margin-top:32px;padding:20px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.thanks h3{margin:0 0 6px;font-size:20px}
/* game */
.gcard{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.gcard .gi{font-size:28px;width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--accent-soft)}
.gcard b{display:block;font-size:16px}
.gcard small{display:block;color:var(--muted);font-size:13px}
.gcard .tag{margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--ok)}
.gcard.locked{opacity:.55}
.lvlist{display:flex;flex-direction:column;gap:10px}
.prog{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--accent)}
.qtext{font-size:19px;font-weight:700;margin:16px 0 14px;text-wrap:pretty}
.opt{font:inherit;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--f-mono);color:var(--muted);flex:none}
.opt:disabled{cursor:default;color:var(--fg);opacity:1}
.opt:disabled:not(.right):not(.wrong){opacity:.6}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--out);background:var(--out-soft)}
.opt.right::after,.opt.wrong::after{margin-left:auto;font-weight:700;flex:none}
.opt.right::after{content:"✓";color:var(--ok)} .opt.wrong::after{content:"✗";color:var(--out)}
.tf button:disabled{color:var(--fg);opacity:.6;cursor:default}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.fb b{display:block;margin-bottom:4px}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--out)}
.myth{margin-top:16px;padding:28px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:700;text-align:center;min-height:140px;display:grid;place-items:center;text-wrap:balance}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tf button{font:inherit;font-size:18px;font-weight:700;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.scene{margin-top:16px}
.scene .when{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.scene p{font-size:17px;margin:6px 0 14px;text-wrap:pretty}
.stack .opt+.opt{margin-top:0}
.end{margin-top:24px;text-align:center}
.end .big{font-size:48px;line-height:1.1}
.end h3{margin:8px 0 4px;font-size:22px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.bdg{padding:14px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:0}
.bdg .bi{font-size:30px;line-height:1.2}
.bdg b{display:block;font-size:13px;margin-top:4px}
.bdg small{display:block;font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
.bdg.off .bi{filter:grayscale(1);opacity:.35}
.bdg.off b{color:var(--muted)}
.redeem{margin-top:16px;padding:16px;border-radius:12px;border:2px dashed var(--accent);background:var(--accent-soft);text-align:center}
.redeem b{font-size:28px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.choice,.chipbtn,.mbtn,.fbtn,.cell,.opt,.tf button{transition:border-color .15s,background .15s}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>好朋友 Pal</h1><span>找補給・我的紀錄・科普遊戲</span></div>
  <nav class="tabs">
    <a href="#today" id="tab-today">今天</a>
    <a href="#cycle" id="tab-cycle">經期</a>
    <a href="#mood" id="tab-mood">心情</a>
    <a href="#map" id="tab-map">地圖</a>
    <a href="#game" id="tab-game">遊戲</a>
    <a href="#badges" id="tab-badges">徽章</a>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script type="module">
import {LEVEL,KINDS,COOLDOWN_MIN,status as rule,ago} from "./rules.js";
import {PASS,BADGES,earned,merge,taipeiDay,dailyQuestion} from "./game-rules.js";
// ===== 設定區 =====
const CONFIG={
  // 回報與遊戲進度 API（Cloudflare Worker，與網頁同一個網站）。留空 = 示範模式，地圖只顯示示範資料
  apiUrl:"/api",
};
// 補給點清單（locs.json）、科普題庫（game.json）都和 LINE Bot 共用
const [LOCS,GAME]=await Promise.all([fetch("./locs.json").then(r=>r.json()),fetch("./game.json").then(r=>r.json())]);
const LIVE=!!CONFIG.apiUrl;
// 經期與心情紀錄只存在這支手機；地圖的匿名代碼沿用好朋友地圖網頁的同一組，兩邊回報冷卻一致
const HKEY="pal-health-v1", MKEY="periodpal-demo-v2", GKEY="pal-game-v1";

// ===== 共用工具 =====
const MIN=60e3, H=60*MIN, DAY=864e5;
const app=document.getElementById("app");
// replaceChildren 會把 null 印成「null」字樣，所以先濾掉沒有要顯示的區塊
const show=(...kids)=>app.replaceChildren(...kids.flat().filter(k=>k!=null));
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const k of kids.flat())if(k!=null)e.append(k);return e}
const SVGNS="http://www.w3.org/2000/svg";
function s(tag,attrs={},...kids){const e=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);for(const k of kids)e.append(k);return e}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function today0(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function diff(a,b){return Math.round((b-a)/DAY)}
function md(d){return(d.getMonth()+1)+"/"+d.getDate()}
const WK="日一二三四五六";
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}

// ===== 健康紀錄（經期＋心情）=====
const FLOW={none:"沒有",spot:"點狀",light:"量少",medium:"中等",heavy:"量多"};
const SYMS=["經痛","經痛很嚴重","頭痛","腹脹","腰痠","疲倦","長痘痘","胸部脹痛","失眠","特別想吃甜"];
const MOODS=["","很差","不太好","普通","不錯","很好"];
const MTAGS=["平靜","開心","有動力","焦慮","煩躁","低落","壓力大","想哭","容易累"];

function seedHealth(){
  const T=today0(),days={};
  const starts=[-98,-70,-41,-12],lens=[4,6,5,5];
  starts.forEach((st,i)=>{for(let j=0;j<lens[i];j++){
    const flow=j===1?"heavy":j===lens[i]-1?"light":"medium";
    const sym=j===0?(i===2?["經痛很嚴重","腰痠"]:["經痛","疲倦"]):j===1?["經痛"]:[];
    days[dkey(addD(T,st+j))]={flow,sym};
  }});
  const preTags=[["煩躁"],["焦慮","容易累"],["低落"],["煩躁","想哭"]],okTags=[["平靜"],["開心"],["有動力"],["平靜","開心"],["壓力大"]];
  for(let n=-45;n<=-1;n++){

    days[k]={...(days[k]||{}),mood:score,tags};
  }
  days[dkey(addD(T,-15))].note="報告截止前一天，熬夜到三點。";
  days[dkey(addD(T,-12))].note="早上開會時突然來，2 樓沒有了，跑到 3 樓才拿到。";

// 經期：連續（間隔 2 天內）有經血的日子算同一次；點狀出血不算開始
function episodes(){
  const ks=Object.keys(HD.days).filter(k=>HD.days[k].flow&&HD.days[k].flow!=="spot").sort();
  const eps=[];
  for(const k of ks){const d=parse(k),last=eps[eps.length-1];if(last&&diff(last.end,d)<=2)last.end=d;else eps.push({start:d,end:d})}
  eps.forEach(e=>e.len=diff(e.start,e.end)+1);
  return eps;
}
// 預測：最近 6 個週期的平均（排除 15 天以下或 60 天以上的極端值）；資料不足時用 28 天、5 天
function cycleInfo(){
  const eps=episodes(),T=today0();
  const cyc=[];for(let i=1;i<eps.length;i++)cyc.push(diff(eps[i-1].start,eps[i].start));
  const recent=cyc.slice(-6).filter(c=>c>=15&&c<=60);
  const avgC=recent.length?Math.round(avg(recent)):28;
  const recentL=eps.slice(-6).map(e=>e.len);
  const avgL=recentL.length?Math.round(avg(recentL)):5;
  const last=eps[eps.length-1];
  if(!last)return{eps,cyc,recent,avgC,avgL,none:true};
  const next=addD(last.start,avgC);
  return{eps,cyc,recent,avgC,avgL,last,next,day:diff(last.start,T)+1,toNext:diff(T,next),inPeriod:T>=last.start&&T<=last.end,guessed:!recent.length};
}
function predictedSet(ci){
  const set=new Set();if(ci.none)return set;
  let st=ci.next;const T=today0();
  if(diff(T,st)<0)st=T; // 已經晚了：從今天起標示
  for(let c=0;c<3;c++){for(let j=0;j<ci.avgL;j++)set.add(dkey(addD(st,j)));st=addD(st,ci.avgC)}
  return set;
}
// 某天屬於哪個階段：經期中／經前一週／其他
function phaseOf(k,ci){
  const d=parse(k);
  for(const e of ci.eps)if(d>=e.start&&d<=e.end)return"period";
  let nx=ci.eps.find(e=>e.start>d);
  const nxd=nx?nx.start:(!ci.none&&d>=ci.last.start?ci.next:null);
  if(nxd&&diff(d,nxd)<=7&&diff(d,nxd)>0)return"pre";
  return"other";
}
const PHASE={period:"經期中",pre:"經前一週",other:"其他日子"};

// 回顧：原型用固定規則產生；正式版交給 Claude Agent 依同樣的資料寫成文字
function insights(ci){
  const out=[];
  if(ci.none){out.push({t:"還沒有經期紀錄。記下這次或上一次月經的日子，就能開始預估。"});return out}
  if(ci.recent.length)out.push({t:"最近 "+ci.recent.length+" 個週期平均 "+ci.avgC+" 天（"+Math.min(...ci.recent)+" 到 "+Math.max(...ci.recent)+" 天），經期平均 "+ci.avgL+" 天。"});
  else out.push({t:"目前只有一次經期紀錄，先用 28 天估算。再記一次就能用你自己的週期。"});
  const odd=ci.recent.filter(c=>c<21||c>35);
  if(odd.length)out.push({flag:true,t:"有 "+odd.length+" 個週期不在一般的 21 到 35 天範圍內（"+odd.join("、")+" 天）。偶爾一次常見，連續發生建議問問醫師。"});
  if(ci.recent.length>=3&&Math.max(...ci.recent)-Math.min(...ci.recent)>=8)out.push({flag:true,t:"週期長短相差 "+(Math.max(...ci.recent)-Math.min(...ci.recent))+" 天，算是比較不規律，預估日期的誤差會比較大。"});
  const longP=ci.eps.slice(-6).filter(e=>e.len>7);
  if(longP.length)out.push({flag:true,t:"有 "+longP.length+" 次經期超過 7 天。如果經常這樣，建議就醫檢查。"});
  const severe=ci.eps.filter(e=>{for(let d=e.start;d<=e.end;d=addD(d,1))if((getDay(dkey(d)).sym||[]).includes("經痛很嚴重"))return true;return false}).length;
  if(severe>=2)out.push({flag:true,t:"有 "+severe+" 次經期記了「經痛很嚴重」。痛到影響上課或需要吃止痛藥才撐得住，可以到保健中心或婦產科諮詢。"});
  if(ci.toNext<-7)out.push({flag:true,t:"已經比預估晚了 "+(-ci.toNext)+" 天。"});
  const by={period:[],pre:[],other:[]};
  for(const[k,v]of Object.entries(HD.days))if(v.mood)by[phaseOf(k,ci)].push(v.mood);
  const a={period:avg(by.period),pre:avg(by.pre),other:avg(by.other)};
  if(a.pre!=null&&a.other!=null&&by.pre.length>=3&&a.other-a.pre>=0.7)
    out.push({t:"經前一週的心情平均 "+a.pre.toFixed(1)+" 分，比其他日子低 "+(a.other-a.pre).toFixed(1)+" 分。下次預估日前一週，可以少排一點硬仗。"});
  else if(by.pre.length<3)out.push({t:"心情紀錄再多幾天，就能看出它跟週期有沒有關係。"});
  return out;
}

  const hs=location.hash.slice(1)||"today";
  const tab=hs.startsWith("r-")?"map":["daily","sim","myth"].includes(hs)||hs.startsWith("lv-")?"game":TABS.includes(hs)?hs:"today";
  for(const t of TABS){const a=document.getElementById("tab-"+t);if(t===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")}
  if(LIVE&&(tab==="map"||tab==="today")&&Date.now()-loadedAt>30e3){
    if(!loadedAt)show(h("p",{class:"note",style:"margin-top:24px"},"載入中…"));
    await pull();
    if((location.hash.slice(1)||"today")!==hs)return; // 載入時已換頁，交給新的 route
  }
  if(hs.startsWith("r-"))viewReport(hs.slice(2));
  else if(hs.startsWith("lv-"))viewLevel(hs.slice(3));
  else if(hs==="daily")viewDaily();
  else if(hs==="sim")viewSim();
  else if(hs==="myth")viewMyth();
  else({today:viewToday,cycle:viewCycle,mood:viewMood,map:viewMap,game:viewGame,badges:viewBadges})[tab]();
}
tabFromQuery();
addEventListener("hashchange",()=>{route();scrollTo(0,0)});route();
initLiff().then(()=>{
  const t=queryTab(), cur=location.hash.slice(1);
  if(t&&TABS.includes(t)&&(!cur||cur==="today")&&t!=="today")location.hash="#"+t;
  else if(cur==="badges")route(); // 同步完更新徽章頁
});
// 停在地圖時每分鐘更新一次
if(LIVE)setInterval(async()=>{if(location.hash==="#map"&&!document.hidden){await pull();if(location.hash==="#map")viewMap()}},60e3);
</script>
